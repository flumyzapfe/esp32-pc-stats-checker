name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CYD dashboard (ESP32)
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - name: LovyanGFX
            sketch: firmware/cyd_dashboard
          - name: Nano OLED ticker (AVR)
            fqbn: arduino:avr:nano
            platforms: |
              - name: arduino:avr
            libraries: |
              - name: Adafruit SSD1306
              - name: Adafruit GFX Library
              - name: Adafruit BusIO
            sketch: firmware/nano_oled_ticker
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: ${{ matrix.libraries }}
          sketch-paths: |
            - ${{ matrix.sketch }}
          enable-warnings-report: true

  host:
    name: Test host script (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r host/requirements.txt
      - name: Run unit tests
        working-directory: host
        run: python -m unittest discover -s tests -t . -v
      - name: Check --help and --sensors work
        working-directory: host
        run: |
          python pc_stats.py --help
          python pc_stats.py --sensors

  ui:
    name: UI preview + protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get LovyanGFX
        run: git clone --depth 1 --branch 1.2.35 https://github.com/lovyan03/LovyanGFX.git tools/ui_preview/LovyanGFX
      - name: Build desktop preview tool
        run: |
          cmake -S tools/ui_preview -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Protocol parser tests (C++)
        run: ./build/test_protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python output parses on the firmware side
        working-directory: host
        run: |
          pip install -r requirements.txt
          python -c "from pcstats.protocol import format_cyd; from tests.fixtures import SAMPLE; print(format_cyd(SAMPLE), end='')" | ../build/test_protocol -
          python -c "import time; from pcstats.collector import StatsCollector; from pcstats.protocol import format_cyd; c = StatsCollector(); time.sleep(1); print(format_cyd(c.read()), end='')" | ../build/test_protocol -
      - name: Render every page
        run: |
          mkdir -p screens
          ./build/ui_preview screens
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: screens/*.png
